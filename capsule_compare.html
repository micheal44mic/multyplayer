<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsule v1 float vs v2 interi — confronto visivo</title>
<style>
  body { background: #131418; color: #d8dbe4; font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 0; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { margin: 0 0 14px; color: #8d92a3; max-width: 900px; }
  .row { margin-bottom: 18px; }
  .row h2 { font-size: 13px; margin: 0 0 6px; color: #aeb3c2; }
  .cells { display: flex; gap: 10px; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell span { display: block; margin-top: 4px; color: #8d92a3; font-size: 11px; }
  canvas { background: #fff; border-radius: 4px; image-rendering: pixelated; }
</style>
</head>
<body>
<h1>Capsule: v1 float (vecchio motore) vs v2 interi (atterrata)</h1>
<p>Stessi tratti, due matematiche. La colonna "diff ×8" amplifica di 8 volte la
differenza di alpha: quello che vedi lì è ciò che a occhio nudo NON si vede
(le differenze reali sono ≤ ~32/255, confinate nella banda anti-aliasing).</p>
<div id="rows"></div>
<script type="module">
  import { mulberry32 } from './js/util.js';
  import { CAP_STRIDE_I32, capsuleIntParams, capsuleIntRun, quantHardness } from './js/capsule_int.js';

  const W = 360, H = 300;

  // replica v1 (il float del vecchio _capsule/brush.falloff, senza bound)
  function falloffV1(dist, r, h) {
    const core = r * h;
    let w = r - core;
    if (w < 1) w = 1;
    const t = (dist - core) / w;
    if (t <= 0) return 1;
    if (t >= 1) return 0;
    return 1 - t * t * (3 - 2 * t);
  }
  const div255 = (x) => { const t = x + 128; return (t + (t >> 8)) >> 8; };
  function v1Run(pix, segs, h, cr, cg, cb) {
    for (const g of segs) {
      const [x0, y0, r0, a0, x1, y1, r1, a1] = g;
      const dx = x1 - x0, dy = y1 - y0;
      const len2 = dx * dx + dy * dy;
      const invLen2 = len2 > 0 ? 1 / len2 : 0;
      const dr = r1 - r0, da = a1 - a0;
      const maxR = Math.max(r0, r1) + 1;
      const bx0 = Math.max(0, Math.floor(Math.min(x0, x1) - maxR));
      const by0 = Math.max(0, Math.floor(Math.min(y0, y1) - maxR));
      const bx1 = Math.min(W - 1, Math.ceil(Math.max(x0, x1) + maxR));
      const by1 = Math.min(H - 1, Math.ceil(Math.max(y0, y1) + maxR));
      for (let iy = by0; iy <= by1; iy++) {
        const py = iy + 0.5;
        let di = (iy * W + bx0) * 4;
        for (let ix = bx0; ix <= bx1; ix++, di += 4) {
          const px = ix + 0.5;
          let t = ((px - x0) * dx + (py - y0) * dy) * invLen2;
          if (t < 0) t = 0; else if (t > 1) t = 1;
          const qx = px - (x0 + dx * t);
          const qy = py - (y0 + dy * t);
          const rT = r0 + dr * t;
          const d2 = qx * qx + qy * qy;
          const lim = rT + 1;
          if (d2 >= lim * lim) continue;
          const a = falloffV1(Math.sqrt(d2), rT, h) * (a0 + da * t);
          if (a <= 0) continue;
          const ma = (a * 255 + 0.5) | 0;
          if (ma > pix[di + 3]) {
            pix[di] = div255(cr * ma);
            pix[di + 1] = div255(cg * ma);
            pix[di + 2] = div255(cb * ma);
            pix[di + 3] = ma;
          }
        }
      }
    }
  }

  // catena di tratto deterministica (nodi con raggio variabile)
  function chain(seed, nodes, step, rBase, rVar) {
    const rnd = mulberry32(seed);
    const out = [];
    let x = 40 + rnd() * 60, y = 60 + rnd() * 120, ang = rnd() * 1.2 - 0.4, r = rBase;
    for (let i = 0; i < nodes; i++) {
      ang += (rnd() - 0.5) * 0.7;
      const nx = Math.min(W - 30, x + Math.cos(ang) * step * (0.5 + rnd()));
      const ny = Math.max(30, Math.min(H - 30, y + Math.sin(ang) * step * (0.5 + rnd())));
      const nr = Math.max(0.4, rBase + Math.sin(i / 6) * rVar);
      out.push([x, y, r, 1, nx, ny, nr, 1]);
      x = nx; y = ny; r = nr;
    }
    return out;
  }

  function show(parent, pix, label) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(W, H);
    // composito su bianco (premultiplied over white)
    for (let i = 0; i < pix.length; i += 4) {
      const a = pix[i + 3], inv = 255 - a;
      img.data[i] = pix[i] + inv;
      img.data[i + 1] = pix[i + 1] + inv;
      img.data[i + 2] = pix[i + 2] + inv;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const span = document.createElement('span');
    span.textContent = label;
    cell.appendChild(cv); cell.appendChild(span);
    parent.appendChild(cell);
  }

  const rows = document.getElementById('rows');
  const cases = [
    { name: 'duro h=1, r 14 (banda AA 1px)', h: 1, segs: chain(31, 60, 9, 14, 4) },
    { name: 'default h=0.85, r 12', h: 0.85, segs: chain(11, 70, 7, 12, 4) },
    { name: 'soft h=0, r 40', h: 0, segs: chain(21, 40, 10, 40, 8) },
    { name: 'gigante h=0.6, r 90 con taper', h: 0.6, segs: chain(41, 16, 22, 90, 60) },
  ];
  const clip = { x0: 0, y0: 0, x1: W - 1, y1: H - 1 };
  let maxOfMax = 0;
  for (const c of cases) {
    const v1 = new Uint8Array(W * H * 4);
    v1Run(v1, c.segs, c.h, 26, 26, 31);
    const recs = [];
    for (const g of c.segs) capsuleIntParams(g[0], g[1], g[2], g[3], g[4], g[5], g[6], g[7], recs);
    const segRecs = new Int32Array(recs);
    const v2 = new Uint8Array(W * H * 4);
    capsuleIntRun(v2, W, H, 0, 0, segRecs, segRecs.length / CAP_STRIDE_I32,
      quantHardness(c.h), 26, 26, 31, clip);
    // diff di alpha amplificata ×8 (rosso su bianco)
    const df = new Uint8Array(W * H * 4);
    let maxD = 0, nD = 0;
    for (let i = 3; i < v1.length; i += 4) {
      const d = Math.abs(v1[i] - v2[i]);
      if (d > 0) { nD++; if (d > maxD) maxD = d; }
      const v = Math.min(255, d * 8);
      df[i - 3] = v; df[i - 2] = 0; df[i - 1] = 0; df[i] = v;
    }
    maxOfMax = Math.max(maxOfMax, maxD);
    const row = document.createElement('div');
    row.className = 'row';
    const h2 = document.createElement('h2');
    h2.textContent = `${c.name} — maxΔalpha ${maxD}, pixel diversi ${nD}`;
    row.appendChild(h2);
    const cells = document.createElement('div');
    cells.className = 'cells';
    show(cells, v1, 'v1 float (prima)');
    show(cells, v2, 'v2 interi (dopo)');
    show(cells, df, 'diff ×8');
    row.appendChild(cells);
    rows.appendChild(row);
  }
  window.__compareResult = { maxOfMax };
</script>
</body>
</html>
