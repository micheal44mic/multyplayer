<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16171c">
<title>Fable Paint — canvas multipli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="planes">
    <div id="grid" aria-hidden="true"></div>
    <div id="boards" aria-hidden="true"></div>
    <canvas id="paint"></canvas>
  </div>
  <div id="cursor" aria-hidden="true"></div>

  <header id="toolbar">
    <div class="tb-group" id="tools">
      <button id="tool-brush" class="tb-btn tool active" title="Pennello (B) — di nuovo per i preset">
        <svg viewBox="0 0 24 24"><path d="M20.7 3.3c-1-1-2.7-.9-3.6.1L9 11.5l3.5 3.5 8.1-8.1c1-1 1.1-2.6.1-3.6zM8 13c-2 0-3.5 1.6-3.5 3.5 0 1.5-1.2 2.2-2.5 2.5 1 1.3 2.7 2 4.5 2 2.8 0 5-2.2 5-5L8 13z"/></svg>
      </button>
      <button id="tool-eraser" class="tb-btn tool" title="Gomma (E)">
        <svg viewBox="0 0 24 24"><path d="M16.2 3.6 21 8.4c.8.8.8 2 0 2.8l-9.2 9.2H7.1l-4-4c-.8-.8-.8-2 0-2.8l10.3-10c.8-.8 2-.8 2.8 0zM5 14l5 5 2.5-2.5-5-5L5 14z"/></svg>
      </button>
      <button id="tool-move" class="tb-btn tool" title="Sposta livello (V)">
        <svg viewBox="0 0 24 24"><path d="M12 1.5 15.2 4.7l-1.4 1.4L13 5.3V11h5.7l-.8-.8 1.4-1.4 3.2 3.2-3.2 3.2-1.4-1.4.8-.8H13v5.7l.8-.8 1.4 1.4L12 22.5l-3.2-3.2 1.4-1.4.8.8V13H5.3l.8.8-1.4 1.4L1.5 12l3.2-3.2 1.4 1.4-.8.8H11V5.3l-.8.8-1.4-1.4L12 1.5z"/></svg>
      </button>
      <button id="tool-pan" class="tb-btn tool" title="Mano / Pan (H, Spazio)">
        <svg viewBox="0 0 24 24"><path d="M11 4a1.5 1.5 0 0 1 3 0v6h1V5.5a1.5 1.5 0 0 1 3 0V13c0 4-2.5 8-7 8-3.5 0-5-2-6.7-5.6l-1.9-4.1c-.5-1 .3-2 1.4-1.9.6.1 1.2.5 1.5 1l1.7 2.6V6a1.5 1.5 0 0 1 3 0v4h1V4z"/></svg>
      </button>
    </div>

    <div class="tb-group">
      <label id="color-wrap" title="Colore">
        <input type="color" id="color" value="#1a1a1f">
      </label>
      <div id="swatches"></div>
    </div>

    <div class="tb-group">
      <button id="btn-undo" class="tb-btn" title="Annulla (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M8 7H4V3L2.5 4.5 8 10V7zM4 7c2-3 5.5-5 9-5a9 9 0 1 1-8.8 11h2.6A6.5 6.5 0 1 0 13 4.5C10.3 4.5 7.9 6 6.5 8H10v2H3V7h1z" transform="translate(1 1)"/></svg>
      </button>
      <button id="btn-redo" class="tb-btn" title="Ripristina (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24"><path d="M21 8h-1c-1.4-2-3.8-3.5-6.5-3.5A6.5 6.5 0 1 0 19.2 14h2.6A9 9 0 1 1 12 3c3.5 0 7 2 9 5z M21 8h-7v2h7V5l-2 2z" transform="translate(-1 1)"/></svg>
      </button>
      <button id="btn-clear" class="tb-btn" title="Cancella tutto">
        <svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 9h12l-1 12H7L6 9zm4 2 .3 8h1.5l-.3-8h-1.5zm3.9 0-.3 8h1.5l.3-8h-1.5z"/></svg>
      </button>
      <button id="btn-export" class="tb-btn" title="Esporta PNG">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.6l-3.3-3.3L7.3 11.7 12 16.4l4.7-4.7-1.4-1.4L12 13.6V3zM5 18h14v2H5z" transform="translate(0 .5)"/></svg>
      </button>
    </div>

    <div class="tb-group">
      <button id="btn-resetview" class="tb-btn" title="Reimposta vista (0)">
        <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 0 7 7h2a9 9 0 1 1-9-9v2zm0-4 4 4-4 4V1z"/></svg>
      </button>
      <div id="zoom-controls" title="Zoom">
        <button id="btn-zoom-out" class="tb-btn zoom-btn" title="Zoom indietro (-)" aria-label="Zoom indietro">-</button>
        <span id="zoom-label">100%</span>
        <button id="btn-zoom-in" class="tb-btn zoom-btn" title="Zoom avanti (+)" aria-label="Zoom avanti">+</button>
      </div>
    </div>

    <div class="tb-spacer"></div>

    <div class="tb-group">
      <button id="btn-hud" class="tb-btn" title="Console prestazioni (`)">
        <svg viewBox="0 0 24 24"><path d="M3 4h18v16H3V4zm2 2v12h14V6H5zm2 8.5 3-3 2 2 4-4 1.4 1.4L12 16.3l-2-2-1.6 1.6L7 14.5z"/></svg>
      </button>
      <button id="btn-stress" class="tb-btn" title="Stress test (board × layer)">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      </button>
      <button id="btn-addboard" class="tb-btn" title="Nuovo canvas">
        <svg viewBox="0 0 24 24"><path d="M3 5h12v14H3V5zm2 2v10h8V7H5zm13 1h2v3h3v2h-3v3h-2v-3h-3v-2h3V8z"/></svg>
        <span class="tb-btn-label">Canvas</span>
      </button>
      <button id="btn-text" class="tb-btn" title="Testo (T)">
        <svg viewBox="0 0 24 24"><path d="M5 4h14v3.2h-5.4V20h-3.2V7.2H5z"/></svg>
        <span class="tb-btn-label">Testo</span>
      </button>
      <button id="btn-layers" class="tb-btn" title="Livelli (L)">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 9l10 6 10-6-10-6zm0 2.4L18.9 9 12 13.1 5.1 9 12 5.4zM4.5 12.6 2 14.1l10 6 10-6-2.5-1.5L12 17.6l-7.5-5z"/></svg>
        <span class="tb-btn-label">Livelli</span>
      </button>
      <button id="btn-panel" class="tb-btn" title="Impostazioni pennello (P)">
        <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4c0 .6 0 1.1-.1 1.6l2 1.6-2 3.5-2.4-1a8 8 0 0 1-2.8 1.6L15.3 22H8.7l-.4-2.7a8 8 0 0 1-2.8-1.6l-2.4 1-2-3.5 2-1.6A8.6 8.6 0 0 1 3 12c0-.6 0-1.1.1-1.6l-2-1.6 2-3.5 2.4 1a8 8 0 0 1 2.8-1.6L8.7 2h6.6l.4 2.7a8 8 0 0 1 2.8 1.6l2.4-1 2 3.5-2 1.6c.1.5.1 1 .1 1.6z" fill-rule="evenodd"/></svg>
        <span class="tb-btn-label">Pennello</span>
      </button>
    </div>
  </header>

  <section id="presetspopup" aria-label="Preset pennello"><!-- generato da presets_ui.js --></section>

  <div id="studio-backdrop" hidden></div>
  <section id="studio" role="dialog" aria-modal="true" aria-label="Studio pennello">
    <div id="studio-head">
      <span id="studio-title">Pennello</span>
      <button id="studio-close" class="tb-btn" title="Chiudi (P)">✕</button>
    </div>
    <div id="bs-preview-wrap">
      <canvas id="bs-preview"></canvas>
      <span id="bs-badge"></span>
    </div>
    <nav id="bs-tabs"><!-- generato da ui.js --></nav>
    <div id="bs-panes"><!-- generato da ui.js --></div>
    <div id="bs-foot">
      <button id="bs-reset">Reimposta pennello</button>
    </div>
  </section>

  <section id="layerspanel" aria-label="Livelli">
    <div id="ly-head">
      <span>Livelli</span>
      <span class="ly-actions">
        <button id="ly-add" class="tb-btn" title="Nuovo livello">+</button>
        <button id="ly-dup" class="tb-btn" title="Duplica livello">⧉</button>
        <button id="ly-del" class="tb-btn" title="Elimina livello">🗑</button>
        <button id="ly-close" class="tb-btn" title="Chiudi">✕</button>
      </span>
    </div>
    <div id="ly-opacity" class="p-row">
      <div class="p-row-head"><span>Opacità</span><span id="ly-opacity-val" class="p-val">100%</span></div>
      <input id="ly-opacity-range" type="range" min="0" max="100" step="1" value="100">
    </div>
    <div id="ly-list"></div>
  </section>

  <section id="textpanel" aria-label="Testo">
    <div id="tp-head">
      <span>Testo</span>
      <button id="tp-close" class="tb-btn" title="Chiudi">✕</button>
    </div>
    <div id="tp-body"><!-- generato da text_ui.js --></div>
  </section>

  <section id="hud" class="collapsed">
    <div id="hud-head">
      <span id="hud-title">⏱ Console</span>
      <span id="hud-fps">— fps</span>
      <button id="hud-copy" title="Copia il report diagnostico negli appunti">copia</button>
      <button id="hud-toggle" title="Apri/chiudi console">▴</button>
    </div>
    <div id="hud-body">
      <canvas id="hud-graph" width="280" height="48"></canvas>
      <pre id="hud-text"></pre>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
